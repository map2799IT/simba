<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    role="img"
    aria-labelledby="title desc"
>
    <title id="title">Logo SIMBA</title>
    <desc id="desc">
        Simbol inventaris bengkel berupa kotak penyimpanan,
        kunci pas, dan obeng.
    </desc>

    <defs>
        <linearGradient
            id="shieldGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0" stop-color="#0B2E63"/>
            <stop offset="1" stop-color="#154E9A"/>
        </linearGradient>

        <linearGradient
            id="boxGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0" stop-color="#39C6D8"/>
            <stop offset="1" stop-color="#1D6FE8"/>
        </linearGradient>

        <filter
            id="softShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >
            <feDropShadow
                dx="0"
                dy="10"
                stdDeviation="12"
                flood-color="#071A40"
                flood-opacity=".22"
            />
        </filter>
    </defs>

    <path
        d="
            M256 38
            L430 132
            L430 330
            C430 391 360 443 256 476
            C152 443 82 391 82 330
            L82 132
            Z
        "
        fill="url(#shieldGradient)"
        filter="url(#softShadow)"
    />

    <path
        d="
            M256 66
            L405 147
            L405 323
            C405 370 350 414 256 445
            C162 414 107 370 107 323
            L107 147
            Z
        "
        fill="none"
        stroke="#FFFFFF"
        stroke-width="14"
        stroke-linejoin="round"
        opacity=".96"
    />

    <!-- Inventory boxes -->
    <g transform="translate(124 220)">
        <path
            d="M0 54 L72 18 L144 54 L72 92 Z"
            fill="#51D2DF"
        />
        <path
            d="M0 54 L72 92 L72 166 L0 128 Z"
            fill="#1D6FE8"
        />
        <path
            d="M72 92 L144 54 L144 128 L72 166 Z"
            fill="#1454B4"
        />

        <path
            d="M62 7 L116 -20 L170 7 L116 35 Z"
            fill="#7CE3EC"
        />
        <path
            d="M62 7 L116 35 L116 88 L62 60 Z"
            fill="#2BB7C9"
        />
        <path
            d="M116 35 L170 7 L170 60 L116 88 Z"
            fill="#1D6FE8"
        />

        <path
            d="M134 121 L188 94 L242 121 L188 149 Z"
            fill="#DCE7F5"
        />
        <path
            d="M134 121 L188 149 L188 202 L134 174 Z"
            fill="#A8BEDA"
        />
        <path
            d="M188 149 L242 121 L242 174 L188 202 Z"
            fill="#6D8CB4"
        />

        <path
            d="M0 54 L72 18 L144 54 L72 92 Z"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linejoin="round"
        />
        <path
            d="M62 7 L116 -20 L170 7 L116 35 Z"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linejoin="round"
        />
        <path
            d="M134 121 L188 94 L242 121 L188 149 Z"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linejoin="round"
        />
    </g>

    <!-- Wrench -->
    <path
        d="
            M162 98
            C136 101 115 122 112 148
            C110 166 117 182 129 194
            L174 239
            L204 209
            L160 165
            C152 157 152 145 160 137
            L180 117
            C175 105 170 100 162 98
            Z
        "
        fill="#FFFFFF"
    />

    <circle
        cx="198"
        cy="232"
        r="17"
        fill="#0B2E63"
    />

    <!-- Screwdriver -->
    <g transform="translate(314 92)">
        <path
            d="
                M26 0
                H54
                L60 82
                H20
                Z
            "
            fill="#39C6D8"
        />

        <rect
            x="12"
            y="72"
            width="56"
            height="31"
            rx="13"
            fill="#FFFFFF"
        />

        <rect
            x="31"
            y="99"
            width="18"
            height="139"
            rx="9"
            fill="#DCE7F5"
        />

        <path
            d="M25 236 H55 L40 274 Z"
            fill="#FFFFFF"
        />
    </g>

    <!-- Inventory scan accent -->
    <g
        fill="#FFFFFF"
        opacity=".88"
        transform="translate(316 314)"
    >
        <rect x="0" y="0" width="20" height="20" rx="3"/>
        <rect x="30" y="0" width="20" height="20" rx="3"/>
        <rect x="60" y="0" width="20" height="20" rx="3"/>
        <rect x="0" y="30" width="20" height="20" rx="3"/>
        <rect x="60" y="30" width="20" height="20" rx="3"/>
        <rect x="0" y="60" width="20" height="20" rx="3"/>
        <rect x="30" y="60" width="20" height="20" rx="3"/>
        <rect x="60" y="60" width="20" height="20" rx="3"/>
        <rect x="31" y="31" width="18" height="18" rx="3" fill="#39C6D8"/>
    </g>
</svg>
